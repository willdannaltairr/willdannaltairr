name: Contribution skyline

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/skyline.py"
      - "assets/contributions.json"
      - ".github/workflows/skyline.yml"

permissions:
  contents: write

jobs:
  skyline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The component reads the contribution calendar from the GraphQL API, so it
      # needs a PAT (METRICS_TOKEN); the repo-scoped GITHUB_TOKEN cannot see it.
      # Without a token the script still runs and draws whatever is cached in
      # assets/contributions.json, so the section never disappears.
      - name: Isometric skyline
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          python scripts/skyline.py \
            --user "${{ github.repository_owner }}" \
            --data assets/contributions.json \
            --save-data assets/contributions.json \
            --out assets

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/skyline-*.svg assets/contributions.json
          git diff --staged --quiet || git commit -m "chore: refresh contribution skyline"
          git push
